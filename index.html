<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vless格式转换</title>
    <link rel="icon" href="asset/favicon.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            background-color: #f8f9fa;
        }
        textarea {
            width: 80%;
            height: 80px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            resize: none;
        }
        button {
            margin-bottom: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .output {
            width: 80%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .copy-button {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-button:hover {
            background-color: #218838;
        }
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
        h1, h3 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Vless订阅格式转换</h1>
    <textarea id="inputText" placeholder="在此输入原始格式"></textarea>
    <button onclick="convertText()">转换</button>
    <div class="output">
        <h3>Clash格式：</h3>
        <textarea id="output1" readonly></textarea>
        <button class="copy-button" onclick="copyToClipboard('output1')">复制</button>
    </div>
    <div id="notification" class="notification">复制成功!</div>

    <script>
        function parseVlessUrl(url) {
            // 匹配基本结构: vless://uuid@server:port?params#name
            const regex = /^vless:\/\/([^@]+)@([^:]+):(\d+)\?(.+)#(.*)$/;
            const match = url.match(regex);
            if (!match) return null;

            const uuid = match[1];
            const server = match[2];
            const port = match[3];
            const paramsStr = match[4];
            const name = match[5];

            // 解析参数
            const params = {};
            paramsStr.split('&').forEach(param => {
                const [key, value] = param.split('=');
                // ech字段不进行URL解码，保持原文
                params[key] = value ? (key === 'ech' ? value : decodeURIComponent(value)) : '';
            });

            return {
                uuid: uuid,
                server: server,
                port: port,
                name: name,
                type: params.type || 'vless',
                encryption: params.encryption || '',
                path: params.path || '/',
                security: params.security || '',
                sni: params.sni || server,
                fp: params.fp || '',
                alpn: params.alpn || '',
                ech: params.ech || ''
            };
        }

        function convertText() {
            const inputText = document.getElementById('inputText').value;
            const lines = inputText.split('\n');
            let output1 = '';

            lines.forEach(line => {
                const parsed = parseVlessUrl(line.trim());
                if (parsed) {
                    let result = `  - {name: ${parsed.name}, server: ${parsed.server}, port: ${parsed.port}, type: ${parsed.type}, uuid: ${parsed.uuid}`;
                    
                    // 添加 tls
                    if (parsed.security === 'tls') {
                        result += ', tls: true';
                    }
                    
                    // 添加 sni
                    if (parsed.sni) {
                        result += `, sni: ${parsed.sni}`;
                    }
                    
                    // 添加 client-fingerprint
                    if (parsed.fp) {
                        result += `, client-fingerprint: ${parsed.fp}`;
                    }
                    
                    // 添加 network 和 ws-opts
                    if (parsed.type === 'ws') {
                        result += `, network: ws, ws-opts: {path: ${parsed.path}}`;
                    }
                    
                    // 添加 alpn (转换为数组格式)
                    if (parsed.alpn) {
                        const alpnArray = parsed.alpn.split(',').map(item => item.trim());
                        result += `, alpn: [${alpnArray.join(', ')}]`;
                    }
                    
                    // 添加 encryption
                    if (parsed.encryption) {
                        result += `, encryption: "${parsed.encryption}"`;
                    }
                    
                    // 添加 ech
                    if (parsed.ech) {
                        result += `, ech: "${parsed.ech}"`;
                    }
                    
                    result += ' }\n';
                    output1 += result;
                }
            });

            document.getElementById('output1').value = output1.trim();
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).value;
            navigator.clipboard.writeText(text).then(() => {
                showNotification('复制成功!');
            }).catch(err => {
                console.error('复制失败:', err);
            });
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
